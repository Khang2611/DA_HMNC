services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Database Service with isolated schema
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: vinatrust-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-vinatrust_bank}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-vinatrust_bank}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - vinatrust-network

  # ----------------------------------------------------------------------------
  # 2. VinaTrust Bank Backend (Spring Boot 3 + Modular Monolith)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vinatrust-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-vinatrust_bank}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-900000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    networks:
      - vinatrust-network

volumes:
  postgres_data:
    name: vinatrust_postgres_data
    driver: local

networks:
  vinatrust-network:
    name: vinatrust_network
    driver: bridge

